# 赛博功德转换器 Nginx 站点配置
# 用法：
#   sudo cp deploy/aichanting.conf /etc/nginx/sites-available/aichanting
#   sudo sed -i 's|YOUR_DOMAIN_OR_IP|your-domain.com|g' /etc/nginx/sites-available/aichanting
#   sudo ln -s /etc/nginx/sites-available/aichanting /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # 改成你的域名；没有域名就填 ECS 公网 IP
    server_name YOUR_DOMAIN_OR_IP;

    # 项目根目录（git clone 后的路径）
    root /opt/aichanting;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态文件直接由 Nginx 提供（性能更好，减轻 Node 负担）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（hash 化的文件可以长期缓存，本项目未做 hash，仅缓存 1 小时）
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # API 请求转发到 Node 服务
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 可选：Nginx 层限流。如需启用，需先在 nginx.conf 的 http {} 块中定义：
        #   limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
        # 然后取消下面这行注释。应用层 server/middleware/rateLimit.js 已有限流，通常无需重复开启。
        # limit_req zone=api_limit burst=60 nodelay;
    }

    # 健康检查端点
    location = /api/health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    # 安全：屏蔽敏感文件
    location ~ /\.(git|env|sqlite3?) {
        deny all;
        return 404;
    }

    client_max_body_size 1m;
}
